<title>Task by Moody</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a calm, Apple-like work planner — list on the left, week on the right, a "now playing" bar at the bottom that coaches the day. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#F5F5F8; --offhours:#ECECF1; --line:#E3E3E8;
  --fg:#1C1C1E; --muted:#86868B; --playhead:#FF3B30; --accent:#0A7AFF; --danger:#FF3B30; --ok:#28A745;
  --shadow:0 1px 2px rgb(0 0 0 / .04),0 4px 16px rgb(0 0 0 / .05);
  --font-ui:"Figtree",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --font-mono:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  --ppm:1.1px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface-2:#232326; --offhours:#141416; --line:#2E2E32;
  --fg:#F5F5F7; --muted:#98989F; --playhead:#FF453A; --accent:#0A84FF; --danger:#FF453A; --ok:#32D74B;
  --shadow:0 1px 2px rgb(0 0 0 / .5),0 6px 20px rgb(0 0 0 / .35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#232326; --offhours:#141416; --line:#2E2E32;
  --fg:#F5F5F7; --muted:#98989F; --playhead:#FF453A; --accent:#0A84FF; --danger:#FF453A; --ok:#32D74B;
  --shadow:0 1px 2px rgb(0 0 0 / .5),0 6px 20px rgb(0 0 0 / .35); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--playhead);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:6px;text-decoration:none;color:inherit}
.brand b{font-size:22px;font-weight:800;font-stretch:125%;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:6px}
.range{font-weight:600;min-width:0;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.icon{padding:7px 10px;line-height:1}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-right:auto}
.lists{display:flex;gap:2px;margin-left:10px}
.lists .btn{font-weight:600;color:var(--muted)}
.lists .btn:hover{color:var(--fg)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.status.cloud i{background:var(--ok)}
.status.err i{background:var(--danger)}
.tabs{display:none;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;padding:7px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg)}

/* main */
.main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:12px;min-height:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:12px;margin:0 auto 0 0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.projects{overflow:auto;flex:1;min-height:0;padding:10px;display:flex;flex-direction:column;gap:10px}
.proj{flex-shrink:0;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);overflow:hidden}
.proj-h{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:start;padding:10px 10px 8px;cursor:pointer}
.dot{width:12px;height:12px;border-radius:3px;background:var(--c);margin-top:3px}
.proj-name{font-weight:700;font-size:15px;line-height:1.25;text-wrap:balance}
.proj-meta{font-size:12px;color:var(--muted);margin-top:2px}
.prio{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.prio.p1{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.prio.p3{color:var(--muted)}
.tasks{list-style:none;margin:0;padding:0 6px 6px}
.task{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:6px 6px;border-radius:7px}
.task:hover{background:var(--surface)}
.task input[type=checkbox]{width:16px;height:16px;accent-color:var(--fg);margin:0}
.task .t{cursor:pointer;min-width:0;line-height:1.3}
.task .t small{display:block;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.task .t small.late{color:var(--danger);font-weight:600}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.dur{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mv{display:flex;flex-direction:column;opacity:.35}
.task:hover .mv{opacity:1}
.mv button{border:0;background:none;cursor:pointer;font-size:10px;line-height:1;padding:1px 3px;color:var(--muted)}
.add{display:grid;grid-template-columns:1fr auto auto;gap:6px;padding:8px 10px 6px;border-top:1px dashed var(--line)}
.add input,.add select,.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:2px 10px 10px}
:root{--solo:#56606E}
.proj.solo .proj-h{padding:9px 10px;align-items:center}
.proj.solo .proj-name{font-size:14px;font-weight:600}
.proj.solo.done .proj-name{text-decoration:line-through;color:var(--muted)}
.proj-meta.late{color:var(--danger)}
.tcheck{width:17px;height:17px;margin:0;accent-color:var(--fg);border-radius:5px}
.ticon{vertical-align:-2px}
.confirm-bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--playhead) 14%,var(--surface))}
.cb-t{flex:1 1 260px;min-width:0;line-height:1.4}
.cb-n{font-size:12px;color:var(--muted);margin-left:4px}
.cb-a{display:flex;gap:6px;flex-wrap:wrap}
.cb-a .btn{padding:5px 10px;font-size:13px}
.seg.pinned{box-shadow:0 0 0 2px var(--c) inset}
.seg{cursor:grab}
.rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize;z-index:6}
.rz::after{content:"";position:absolute;left:50%;bottom:2px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:var(--c);opacity:0;transition:opacity .1s}
.seg:hover .rz::after,.blk:hover .rz::after,.resizing .rz::after{opacity:.8}
.seg.past .rz{display:block}
.resizing{z-index:5;outline:2px dashed var(--c)}
.wh{position:absolute;left:0;right:0;height:0;z-index:1;pointer-events:none;cursor:ns-resize;display:flex;justify-content:center}
.wh::before{content:"";position:absolute;left:0;right:0;top:-5px;height:10px;pointer-events:auto}
.wh span{position:relative;transform:translateY(-50%);font-family:var(--font-mono);font-size:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted);opacity:0;transition:opacity .12s;white-space:nowrap;pointer-events:none}
.daycol:hover .wh span,.wh.on span{opacity:1}
.wh.on{border-top:2px dashed var(--playhead)}
.wh.on span{color:var(--fg);border-color:var(--playhead)}
.seg.past{opacity:.6;background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.seg.past.isdone{opacity:1;background:color-mix(in srgb,var(--ok) 16%,var(--surface));border-left-color:var(--ok);box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 35%,transparent) inset}
.seg.past.isdone b{padding-right:24px}
.okb{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:6px;background:var(--ok);display:grid;place-items:center;box-shadow:0 2px 6px color-mix(in srgb,var(--ok) 45%,transparent)}
.seg.tiny .okb{width:16px;height:16px;top:2px;border-radius:5px}
.blk.evok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-left-color:var(--ok);box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 35%,transparent) inset}
.blk.evok b{padding-right:24px}
.blk.evno{opacity:.5}.blk.evno b{text-decoration:line-through}
.btn.ok{background:var(--ok);color:#fff;box-shadow:none}
.btn.ok:hover{background:color-mix(in srgb,var(--ok) 85%,#000)}
.addmore{align-self:center;flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1px dashed var(--muted);background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;margin:2px 0 6px}
.addmore:hover{border-style:solid;color:var(--fg);border-color:var(--fg)}
.item{flex-shrink:0;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;background:var(--surface-2)}
.item-h{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;padding:8px 8px 8px 6px;cursor:pointer}
.it-body{min-width:0}
.it-title{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item.done .it-title{text-decoration:line-through;color:var(--muted)}
.it-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.it-meta.late span:last-child{color:var(--danger)}
.tag{font:inherit;font-size:11px;font-weight:600;border:0;border-radius:999px;padding:2px 8px;cursor:pointer;color:var(--fg);background:color-mix(in srgb,var(--c) 22%,var(--surface));max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag:hover{background:color-mix(in srgb,var(--c) 35%,var(--surface))}
.tag.solo{cursor:default;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.item:hover .grip{opacity:1}
.item.pdrag{opacity:.35}
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:9px;border:1px solid var(--line);border-left:3px solid var(--c);background:var(--surface)}
.fbar b{font-size:14px}
.fbar small{color:var(--muted)}
.fbar .linkbtn:first-of-type{margin-left:auto}
.ctx-sw{display:grid;grid-template-columns:repeat(10,20px);gap:6px;padding:4px 10px 8px}
.ctx .csw{width:20px;height:20px;border-radius:50%;border:0;padding:0;background:var(--c);cursor:pointer;transition:transform .12s}
.ctx .csw:hover{transform:scale(1.18);background:var(--c)}
.ctx .csw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.ctx .csw-reset{grid-column:1/-1;border:0;background:none;color:var(--muted);font-size:12px;text-align:left;padding:2px 0;cursor:pointer}
.ctx .csw-reset:hover{color:var(--fg);background:none}
.ctx-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);padding:8px 10px 4px}
.slist{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2)}
.srow small{color:var(--muted);font-family:var(--font-mono);font-size:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:-6px;align-items:center}
.pchip{position:relative;display:inline-flex;align-items:center;border-radius:8px}
.pchip .px{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .1s}
.pchip:hover .px,.pchip .px:focus-visible{opacity:1}
.pchip.arm{gap:4px;border:1px solid var(--danger);padding:2px;background:color-mix(in srgb,var(--danger) 10%,var(--surface))}
.pchip.arm .preset{border:0;background:none;color:var(--danger);font-weight:600;padding:4px 6px}
.pchip.arm .px{position:static;opacity:1;width:auto;height:auto;border-radius:6px;padding:3px 8px;font-size:12px}
.pchip.arm .px.yes{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.pchip.over .preset{border-color:var(--playhead);box-shadow:-3px 0 0 var(--playhead)}
.pchip.dragging-p{opacity:.4}
.plus-p{font-weight:700;padding:6px 12px}
.padd{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.padd input{flex:1 1 180px;min-width:0;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--surface)}
.padd select{border:1px solid var(--line);border-radius:7px;padding:6px;background:var(--surface)}
.padd .btn{padding:5px 10px}
.phint{font-size:11px;color:var(--muted);margin-left:2px}
.preset{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.preset:hover{border-color:var(--fg)}
.wl{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .35s ease}
.wl.in{opacity:1}.wl.out{opacity:0}
.wl-card{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgb(0 0 0 / .25);padding:26px 26px 18px;transform:translateY(14px) scale(.98);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.wl.in .wl-card{transform:none}.wl.out .wl-card{transform:translateY(-10px) scale(.98)}
.wl-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.wl-brand{font-weight:800;color:var(--fg);letter-spacing:.02em;text-transform:none;font-size:14px}.wl-brand i{font-style:normal;font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-left:3px}
.wl-h{font-size:clamp(30px,6vw,44px);font-weight:800;font-stretch:118%;letter-spacing:-.02em;line-height:1.05;margin:18px 0 6px;text-wrap:balance}
.wl-sub{margin:0 0 18px;color:var(--muted);font-size:15px}
.wl-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.wl-stats div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);min-width:0}
.wl-stats b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.wl-stats span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis}
.wl-opts{display:flex;flex-direction:column;gap:8px}
.wl-opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);cursor:pointer;transition:border-color .15s,transform .15s}
.wl-opt:hover{border-color:var(--fg);transform:translateY(-1px)}
.wl-opt b{display:block;font-size:15px}.wl-opt small{color:var(--muted);font-size:13px}
.wl-opt.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}.wl-opt.primary small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.wl-opt input{border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--surface);font:inherit;font-size:13px}
.wl-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,currentColor 12%,transparent);font-size:13px}
.wl-skip{display:block;margin:14px auto 0;border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline}
.wl-tl{margin:6px 0 14px}
.wl-track{position:relative;height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.wl-seg{position:absolute;top:5px;bottom:5px;border-radius:5px;background:var(--c);transform-origin:left;transform:scaleX(0);opacity:0;animation:wlgrow .55s cubic-bezier(.2,.8,.2,1) forwards}
.wl-seg.ev{top:10px;bottom:10px;opacity:0;background:repeating-linear-gradient(135deg,var(--c) 0 4px,transparent 4px 8px)}
.wl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--playhead);box-shadow:0 0 0 3px color-mix(in srgb,var(--playhead) 25%,transparent);animation:wlpulse 1.2s ease-in-out infinite}
.wl-ticks{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:5px}
.wl-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wl-list li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;opacity:0;transform:translateY(6px);animation:wlin .4s ease forwards}
.wl-list i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.wl-list small{font-family:var(--font-mono);color:var(--muted)}
@keyframes wlgrow{to{transform:scaleX(1);opacity:1}}
@keyframes wlin{to{opacity:1;transform:none}}
@keyframes wlpulse{50%{opacity:.4}}
.seg.intro{animation:segin .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes segin{from{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.wl-seg,.wl-list li,.seg.intro{animation:none;opacity:1;transform:none}.wl,.wl-card{transition:none}}
@media (max-width:520px){.wl-stats{grid-template-columns:1fr 1fr}.wl-stats div:last-child{grid-column:1/-1}.wl-card{padding:20px 18px 14px}}
#pauseBtn{display:none!important}
#dayBtn[data-mode="end"]{border-color:var(--playhead)}
#dayBtn[data-mode="closed"]{color:var(--muted)}
.confetti{position:fixed;inset:0;z-index:80;pointer-events:none}
.de-add{display:flex;gap:6px}.de-add .btn{padding:6px 10px;font-size:13px}
.wl-opt:has(.de-add){cursor:default}.wl-opt:has(.de-add):hover{transform:none;border-color:var(--line)}
.cel-next{border-radius:14px;background:var(--surface-2);padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.cel-nh{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:baseline}
.cel-nh span{grid-row:span 2;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--accent);border-radius:8px;padding:4px 8px;align-self:center}
.cel-nh b{font-size:16px}.cel-nh small{color:var(--muted);font-size:12px}
.ds{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.ds-big{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.ds-big>div:first-child b{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1;display:block}
.ds-big>div:first-child span{font-size:13px;color:var(--muted)}
.ds-sm{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px}
.ds-sm span{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:4px 10px}
.ds-sm b{color:var(--fg)}
.ds-span{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 12px}
.ds-span b{color:var(--fg)}
.ed-row.tr .ed-bar i{background:repeating-linear-gradient(135deg,var(--muted) 0 4px,transparent 4px 8px)}
.ed-big b{font-size:34px;font-weight:800;font-stretch:115%;display:block;line-height:1}
.ed-big span{color:var(--muted);font-size:13px}
.ed-rows{display:flex;flex-direction:column;gap:6px}
.ed-row{display:grid;grid-template-columns:minmax(0,1.2fr) 2fr auto;gap:10px;align-items:center;font-size:13px}
.ed-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}

.seg,.blk{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 7px;overflow:hidden;cursor:pointer;font-size:12px;line-height:1.25;
  background:color-mix(in srgb,var(--c) 20%,var(--surface));border-left:3px solid var(--c);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent) inset}

.seg.tiny{padding:1px 6px}
.seg.tiny em,.seg.tiny .tc{display:none}
.dragbox{position:absolute;left:4px;right:4px;border:2px dashed var(--fg);border-radius:6px;background:color-mix(in srgb,var(--fg) 8%,transparent);pointer-events:none;z-index:4;font-family:var(--font-mono);font-size:11px;padding:3px 6px}

/* ---------- Apple skin ---------- */

.cal-head{background:var(--surface);border-bottom:1px solid var(--line);z-index:40;box-shadow:0 6px 12px -10px rgb(0 0 0 / .25)}

.away{border:0;background:var(--surface-2);font-weight:600}
.daycol{border-left:1px solid var(--line)}

.gutter{font-size:11px;font-weight:500}
.seg,.blk{border-radius:8px;left:3px;right:3px;padding:5px 8px;border-left-width:3px;box-shadow:none}
.seg{background:color-mix(in srgb,var(--c) 16%,var(--surface));z-index:2}

const TEMPLATES=[['Selezione girato',120],['Montaggio',240],['Color e audio',120],['Video verticale',90],['Adattamento social',60],['Sottotitoli',45],['Revisioni cliente',60],['Caricare file sul cloud',30]];

const S={settings:defSettings(),clients:{},projects:{},tasks:{},blocks:{},jobs:{},quotes:{},biz:{}};

const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));

/* ---------- dates ---------- */
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=parse(k);d.setDate(d.getDate()+n);return key(d)}

  if(act)el.querySelector('button').onclick=()=>{el.classList.remove('on');act.run()};

function freeIntervals(k,fromMin,extra){
  const s=S.settings,[ws,we]=hoursFor(k);let iv=[[Math.max(ws,fromMin),we]];
  const busy=[...((extra&&extra[k])||[])];
  const bl=blocksOn(k);bl.forEach(b=>{busy.push([b.start,b.end]);const r=bufRanges(b,k,bl);if(r.before)busy.push(r.before);if(r.after)busy.push(r.after)});
  busy.forEach(([a,b])=>{
    const out=[];iv.forEach(([x,y])=>{if(b<=x||a>=y)out.push([x,y]);else{if(a>x)out.push([x,a]);if(b<y)out.push([b,y])}});iv=out;

function computePlan(fromMs){

  const segs=[],info={},extra={},pinnedIds=new Set(),carry={};
  all.filter(t=>t.pin&&leftOf(t)>0&&t.pin.d>=k0).forEach(t=>{
    const k=t.pin.d,st=k===k0?Math.max(t.pin.s,m0):t.pin.s,left=leftOf(t),en=Math.min(1440,st+left);
    if(en<=st)return;
    segs.push({id:t.id,date:k,start:st,end:en,pinned:true});(extra[k]=extra[k]||[]).push([st,en]);pinnedIds.add(t.id);
    if(en-st<left)carry[t.id]=left-(en-st);else info[t.id]={endDate:k,end:en};
  });
  const queueT=all.filter(t=>leftOf(t)>0&&(!pinnedIds.has(t.id)||carry[t.id])).map(t=>({t,left:carry[t.id]||leftOf(t)}));
  // pin "a catena": le attività che vengono dopo nell'ordine partono dalla fine del blocco fissato
  const idx={};all.forEach((t,i)=>idx[t.id]=i);

    const endMs=msOf(x.date,x.end);
    queueT.forEach(q=>{if(q.t.id!==x.id&&idx[q.t.id]>idx[x.id]&&(!q.nb||q.nb.ms<endMs))q.nb={d:x.date,m:x.end,ms:endMs}});
  });

    const k=addDays(k0,d);

    for(const [a,b] of freeIntervals(k,d===0?m0:0,extra)){
      let cur=a;

        const q=queueT[i];

        const take=Math.min(q.left,b-cur);

  const seen={};segs.forEach(x=>{seen[x.id]=(seen[x.id]||0)+1;x.part=seen[x.id];x.parts=parts[x.id]});

}

function track(force){noUndo++;try{return trackInner(force)}finally{noUndo--;refreshStable()}}
function trackInner(force){
  if(mode==='loading'||readOnly)return;

  const now=Date.now(),from=S.settings.trackedUntil;
  if(!from||from>now){S.settings.trackedUntil=now;saveSettings();return}
  if(!force&&now-from<5*60000)return;

  plan.segs.forEach(x=>{

function dropTask(m){

  const title=m.t.title,others=orderedPending().some(x=>x.id!==m.t.id);

    const glued0=snapEdges(m.t.id,m.li,m.date).some(x=>x.m===m.ns||x.m===m.ns+m.segLen);
    const end=logPast(m.t.id,m.date,m.ns,m.ns+m.segLen,(m.kind==='log'||m.kind==='run')?m.li:undefined);
    const glued=glued0;
    if(others&&end&&end<now&&!glued)askChain(`Hai segnato «${title}» dalle ${hm(m.ns)} alle ${hm(Math.min(m.ns+m.segLen,m.date===key(new Date())?nowMin():1440))}.`,

    return;
  }
  const rmIdx=(m.kind==='log'||m.kind==='run')?m.li:undefined;
  if(startMs<now-60000){
    // il blocco parte nel passato e arriva oltre adesso: la parte passata diventa storico, il resto continua da adesso
    const today=key(new Date());

  }

  setTimeout(()=>moveInQueue(m.t.id,Math.max(startMs,now)),0);

  const hit=segsS.find(x=>x.b>T);

  const ids=list.map(x=>x.id);ids.splice(pos,0,id);

const compact=s=>N(s).replace(/[^a-z0-9]/g,'');
function lev(a,b){const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}}return d[b.length]}
function similarClient(name,skipId){
  const c=compact(name);let exact=null,near=null,nd=99;
  for(const x of Object.values(S.clients)){
    if(x.id===skipId)continue;const k=compact(x.name);
    if(k===c){exact=x;break}
    const d=lev(k,c),lim=Math.max(k.length,c.length)>=8?2:1;
    if(d<=lim&&d<nd){near=x;nd=d}
  }
  return {exact,near};
}

function backupData(){return {app:'task-by-moody',version:2,exportedAt:new Date().toISOString(),data:JSON.parse(JSON.stringify({clients:S.clients,projects:S.projects,tasks:S.tasks,blocks:S.blocks,jobs:S.jobs,quotes:S.quotes,biz:S.biz,settings:S.settings}))}}

      catch(e){if(e&&e.code==='declined'){bkMsg('Salvataggio annullato.');return}}}

      }
      st.workStart=tm.start;st.workEnd=tm.end;saveSettings();scrollToWork();
      return {text:`Ok, da ora il tuo orario è dalle ${hm(tm.start)} alle ${hm(tm.end)} tutti i giorni. Per un giorno solo scrivi anche la data, es. "giovedì lavoro dalle 7 alle 17".`,undo:1};
    }
  }
  // pausa da adesso
  if(/\b(pausa|break|stacco)\b/.test(n)&&!/\b(pranzo|dalle|alle|niente|togli|senza|elimina|cancella)\b/.test(n)&&!/\b\d{1,2}[:.]\d{2}\b/.test(n)){
    const t=T(raw);const d=takeDur(t)||(/\bun'?\s?ora\b/.test(n)?60:30);
    startPause(d);return {text:`Pausa di ${dur(d)} da adesso, fino alle ${hm(Math.min(1440,nowMin()+d))}. L'attività in corso riprende dopo.`,undo:1};
  }
  // pausa pranzo
  if(/\bpausa\b/.test(n)){
    if(/\b(niente|togli|senza|elimina|cancella|no)\b/.test(n)){setLunch(null);return {text:'Tolta la pausa pranzo.',undo:1}}
    const t=T(raw);const tm=takeTime(t);
    if(tm&&tm.end>tm.start){
      const ds=takeDates(t);
      if(ds.length&&S.blocks.lunch){const b=S.blocks.lunch,ex={...(b.exceptions||{})};ds.forEach(k=>ex[k]={start:tm.start,end:tm.end});put('blocks',{...b,exceptions:ex});goTo(ds[0]);return {text:`Spostata la pausa solo ${ds.map(longDate).join(', ')}: dalle ${hm(tm.start)} alle ${hm(tm.end)}.`,undo:1}}
      setLunch(tm.start,tm.end);return {text:`Pausa pranzo nei giorni lavorativi dalle ${hm(tm.start)} alle ${hm(tm.end)}.`,undo:1}}
  }
  // nuovo cliente
  m=/^(?:nuovo|crea|aggiungi|inserisci|metti)\s+(?:un\s+|il\s+)?(?:nuovo\s+)?cliente\s+(.+)$/.exec(n);
  if(m){
    const name=cleanTitle(raw.trim().slice(m[0].length-m[1].length));if(!name)return {text:'Come si chiama il cliente?',err:1};
    const {exact,near}=similarClient(name);
    if(exact)return {text:`${exact.name} è già presente nella lista clienti.`};
    if(near)return {text:`Attenzione: c'è già un cliente molto simile, "${near.name}". Vuoi aggiungere comunque "${name}"?`,confirm:{yes:`Sì, aggiungi ${name}`,no:`No, tengo ${near.name}`,run:()=>{findOrCreateClient(name);return `Aggiunto il cliente ${name}.`},cancel:`Ok, non l'ho aggiunto: resta ${near.name}.`}};
    findOrCreateClient(name);return {text:`Aggiunto il cliente ${name}. Ora puoi creare un progetto, es. "nuovo progetto Spot cliente ${name}".`,undo:1};
  }
  // nuovo progetto
  m=/^(?:nuovo|crea|aggiungi|apri)\s+(?:un\s+)?(?:nuovo\s+)?progetto\b/.exec(n);
  if(m){
    const t=T(raw);cut(t,m.index,m[0].length);
    // attività elencate nel comando
    let taskSpecs=[];
    const tm=/[,;]?\s*\b(?:(?:e\s+)?(?:sotto|dentro|all'?\s?interno)\s+(?:mi\s+|ci\s+)?(?:metti|mettici|aggiungi|aggiungici|inserisci|crea|creami|fai)\s+(?:anche\s+)?(?:(?:\d+|un[ao']?|qualche|due|tre|quattro|cinque|sei|sette|otto|alcune|delle|le|queste)\s+)?(?:attivita|task)|(?:e\s+)?(?:mi\s+)?(?:metti|mettici|aggiungi|aggiungici|inserisci)\s+(?:dentro|sotto)\s+(?:anche\s+)?(?:(?:\d+|un[ao']?|qualche|due|tre|quattro|cinque|sei|sette|otto|alcune|delle|le|queste)\s+)?(?:attivita|task)|con\s+all'?\s?interno|con\s+dentro|che\s+contiene|contenente|con\s+(?:le\s+|l'\s?|i\s+)?(?:(?:\d+|un[ao']?|qualche|due|tre|quattro|cinque|sei|sette|otto|alcune|delle|le|queste)\s+)?(?:seguenti\s+)?(?:attivita|task))\b\s*(?:(?:le\s+|l'\s?|i\s+)?(?:seguenti\s+)?(?:attivita|task)\b)?\s*(?:(?:che\s+)?(?:possono\s+essere|sono|saranno|tipo|cioe|come|ovvero|e\s+cioe)\b)?\s*:?/.exec(t.n);
    if(tm){
      let rest=T(t.o.slice(tm.index+tm[0].length));
      t.o=t.o.slice(0,tm.index);t.n=t.n.slice(0,tm.index);
      const pm2=/\bpriorit[a]\s+(alta|media|bassa|urgente)\b/.exec(rest.n);if(pm2){t.o+=' '+rest.o.substr(pm2.index,pm2[0].length);t.n+=' '+pm2[0];cutM(rest,pm2)}
      let txt=rest.o;const keep=[];
      TEMPLATES.forEach(([nm])=>{const re=new RegExp(nm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');txt=txt.replace(re,x=>{keep.push(x);return '\u0001'+(keep.length-1)+'\u0001'})});
      taskSpecs=txt.split(/\s*(?:,|;|\n|\s+e\s+poi\s+|\s+poi\s+|\s+e\s+|\s+più\s+)\s*/i)
        .map(x=>x.replace(/\u0001(\d+)\u0001/g,(a,i)=>keep[+i]))
        .map(x=>{const tt=T(x);const d=takeDur(tt);let ti=tt.o.replace(/\s+/g,' ').trim().replace(/^(?:(?:e|l'|la|le|lo|il|i|un|una|uno|attivit[aà]|task|poi)\s+|l')+/i,'').replace(/[.,;:!?]+$/,'').trim();return {title:ti?ti[0].toUpperCase()+ti.slice(1):'',minutes:d}}).filter(x=>x.title);
    }
    let prio=2;const pm=/\bpriorit[a]\s+(alta|media|bassa|urgente)\b|\b(urgente)\b/.exec(t.n);if(pm){prio=PRIOW[pm[1]||pm[2]];cutM(t,pm)}
    let deadline=null;const dm=/\b(?:consegna|entro|scadenza)\b/.exec(t.n);
    if(dm){const sub=T(t.o.slice(dm.index));const ds=takeDates(sub);if(ds.length){deadline=ds[0];t.o=t.o.slice(0,dm.index);t.n=t.n.slice(0,dm.index)}}
    let client='';const cm=/\b(?:cliente|per il cliente|per)\s+(.+)$/.exec(t.n);
    if(cm&&/\bcliente\b/.test(cm[0])){client=cleanTitle(t.o.slice(cm.index+cm[0].length-cm[1].length));t.o=t.o.slice(0,cm.index);t.n=t.n.slice(0,cm.index)}
    const name=cleanTitle(t.o);
    if(!name)return {text:'Come si chiama il progetto? Es. "nuovo progetto Spot Nike priorità alta".',err:1};
    let clientId=null,color=PALETTE[Object.keys(S.projects).length%PALETTE.length];
    let nearNote='';
    if(client){const sc=similarClient(client);const c=sc.exact||sc.near||findOrCreateClient(client);if(!sc.exact&&sc.near)nearNote=` (ho usato il cliente già presente "${c.name}")`;clientId=c.id;color=c.color;client=c.name}
    const p={id:uid(),name,client,clientId,color,priority:prio,deadline,created:Date.now()};
    put('projects',p);
    const head=`Creato il progetto "${name}"${client?` per ${client}${nearNote}`:''}, priorità ${PRIO[prio].toLowerCase()}${deadline?`, consegna ${longDate(deadline)}`:''}`;
    if(taskSpecs.length){
      const ids=[];
      taskSpecs.forEach((x,i)=>{const id=uid();ids.push(id);put('tasks',{id,projectId:p.id,title:x.title,minutes:x.minutes||60,done:false,order:i+1,deadline:null,priority:prio,created:Date.now()+i})});
      const def=taskSpecs.filter(x=>!x.minutes).length;
      return {text:`${head}, con ${taskSpecs.length} ${taskSpecs.length===1?'attività':'attività'}.${def?` Ho messo 1h ${def===taskSpecs.length?'a ognuna':'a quelle senza durata'}: se vuoi cambiala qui sotto, insieme alla priorità.`:' Se vuoi cambia qui sotto durate e priorità.'}`,undo:1,ctrl:{pid:p.id,ids}};
    }
    return {text:`${head}. Ora aggiungi le attività, es. "aggiungi montaggio 4h a ${name.toLowerCase()}".`,undo:1};
  }

  // archivia progetto
  m=/^(?:archivia|chiudi il progetto|progetto completato|ho finito il progetto|completa il progetto)\b/.exec(n);
  if(m){
    const t=T(raw);cut(t,m.index,m[0].length);const f=findProject(t);
    if(!f)return {text:'Quale progetto? Es. "archivia spot nike".',err:1};
    archiveProject(f.p);return {text:`Archiviato "${f.p.name}". Lo ritrovi in Progetti → Visualizza progetti archiviati.`,undo:1};
  }
  // fatto
  m=/^(?:ho\s+)?(?:fatto|fatta|finito|finita|completato|completata|chiuso|chiusa|segna\s+(?:come\s+)?fatt[ao])\b/.exec(n);
  if(m){
    const t=T(raw);cut(t,m.index,m[0].length);
    const q=words(t.o);if(!q.length)return {text:'Quale attività? Es. "fatto montaggio spot".',err:1};
    let best=null,bs=0;
    allTasks().filter(x=>!x.done&&S.projects[x.projectId]&&!S.projects[x.projectId].archived).forEach(x=>{
      const tw=words(x.title),pw=x.solo?[]:words(S.projects[x.projectId].name+' '+(S.projects[x.projectId].client||''));
      let s=0;q.forEach(w=>{if(tw.some(z=>z.startsWith(w)||w.startsWith(z)))s+=w.length*2;else if(pw.includes(w))s+=w.length});
      const st=PLAN.info[x.id]?.start;const tie=st?st.date+hm(st.start):'z';
      if(s>bs||(s===bs&&s>0&&best&&tie<best.tie)){bs=s;best={x,tie}}
    });
    if(!best||bs<4)return {text:'Non trovo questa attività tra quelle da fare. Controlla il nome nella lista progetti.',err:1};
    const x=best.x;
    if(x.solo){put('projects',{...S.projects[x.id],done:true,doneAt:Date.now()});return {text:`Fatta la task "${x.title}". Il calendario si è ricompattato.`,undo:1}}
    put('tasks',{...x,done:true,doneAt:Date.now()});
    return {text:`Fatto: "${x.title}" di ${S.projects[x.projectId].name}. Il calendario si è ricompattato.`,undo:1};
  }

  // cancella evento o attività
  m=/^(?:cancella|elimina|togli|rimuovi)\b/.exec(n);
  if(m){
    const t=T(raw);cut(t,m.index,m[0].length);const ds=takeDates(t);const q=words(t.o).filter(w=>!['impegno','evento','attivita','appuntamento'].includes(w));
    const blk=Object.values(S.blocks).filter(b=>(!ds.length||ds.some(k=>occurs(b,k)))&&q.some(w=>words(b.title).some(z=>z.startsWith(w)))).sort((a,b)=>(a.date+a.start)<(b.date+b.start)?-1:1);
    const today=key(new Date()),pick=blk.find(b=>isRec(b)||b.date>=today)||blk[0];
    if(pick&&isRec(pick)&&ds.length){const ex={...(pick.exceptions||{})};ds.forEach(k=>ex[k]='skip');put('blocks',{...pick,exceptions:ex});return {text:`Tolto "${pick.title}" solo ${ds.map(longDate).join(', ')}. Gli altri giorni restano.`,undo:1}}
    if(pick){del('blocks',pick.id);return {text:isRec(pick)?`Cancellato "${pick.title}" in tutte le ripetizioni. Per toglierlo un giorno solo scrivi anche la data.`:`Cancellato "${pick.title}" di ${longDate(pick.date)}. Le attività hanno ripreso quello spazio.`,undo:1}}
    const tk=allTasks().find(x=>!x.done&&q.length&&q.every(w=>words(x.title+' '+(x.solo?'':S.projects[x.projectId]?.name||'')).some(z=>z.startsWith(w))));
    if(tk&&tk.solo){del('projects',tk.id);return {text:`Eliminata la task "${tk.title}".`,undo:1}}
    if(tk){del('tasks',tk.id);return {text:`Eliminata l'attività "${tk.title}".`,undo:1}}
    return {text:'Non trovo cosa cancellare. Es. "cancella dentista" o "cancella dentista giovedì".',err:1};
  }

  // priorità
  m=/\bpriorit[a]\s+(alta|media|bassa|urgente)\b/.exec(n);
  if(m&&!hasTime&&!/^(aggiungi|nuov|task|promemoria|ricordami|devo|metti|inserisci|crea)/.test(n)){
    const t=T(raw);cutM(t,m);const f=findProject(t);
    if(!f)return {text:'A quale progetto? Es. "priorità alta a spot prodotto".',err:1};
    setProjectPriority(f.p,PRIOW[m[1]]);
    return {text:`"${f.p.name}" ora ha priorità ${PRIO[PRIOW[m[1]]].toLowerCase()}. Ho riordinato il calendario.`,undo:1};
  }

  // evento con orario
  if(hasTime){
    const t=T(raw);const rp=takeRepeat(t);const ds=takeDates(t);const tm=takeTime(t);
    if(tm){
      let k=ds[0]||key(new Date());let {start,end}=tm;
      if(start<7*60&&end<=13*60&&start<end){start+=720;end+=720}
      if(end<=start)end=start+60;end=Math.min(end,1440);
      const title=cleanTitle(t.o)||'Evento';
      const hit=PLAN.segs.some(x=>x.date===k&&x.start<end&&x.end>start);
      const repeat=rp?{freq:rp.freq,interval:1,endType:rp.count?'count':'never',count:rp.count||null,until:null}:{freq:'none',interval:1,endType:'never'};
      const nb={id:uid(),title,color:'#7C8796',date:k,start,end,repeat,exceptions:{}};
      put('blocks',nb);goTo(k);
      return {text:`Aggiunto "${title}" ${rp?repLabel(nb)+', a partire da '+longDate(k):longDate(k)} dalle ${hm(start)} alle ${hm(end)}.${hit?' Le attività in quell’orario sono slittate.':''}`,undo:1};
    }
  }

  // nuova attività
  m=/^(?:aggiungi(?:\s+(?:una\s+)?task)?|nuova task|nuovo task|nuova attivita|attivita|task|promemoria|ricordami di|devo fare|devo|metti|inserisci)\b/.exec(n);
  {
    const t=T(raw);if(m)cut(t,m.index,m[0].length);
    const d=takeDur(t);let f=findProject(t);
    if(m&&/^(?:task|nuova task|nuovo task|promemoria|ricordami)/.test(m[0].trim())&&f&&!t.n.includes(projKey(f.p)))f=null;
    if(m||(d&&f)){
      let p=f?.p;
      if(f)cut(t,f.i,f.l);
      let deadline=null;const dm=/\b(?:entro|scadenza|per)\b/.exec(t.n);
      if(dm){const sub=T(t.o.slice(dm.index));const ds=takeDates(sub);if(ds.length){deadline=ds[0];t.o=t.o.slice(0,dm.index);t.n=t.n.slice(0,dm.index)}}
      let sprio=2;const spm=/\bpriorit[a]\s+(alta|media|bassa|urgente)\b|\b(urgente)\b/.exec(t.n);if(spm){sprio=PRIOW[spm[1]||spm[2]];cutM(t,spm)}
      const title=cleanTitle(t.o);if(!title)return {text:'Cosa devo aggiungere? Es. "task mandare mail a Luca 15 min" o "aggiungi video verticale 1h30 a spot".',err:1};
      if(!p){
        const sp={id:uid(),kind:'task',name:title,minutes:d||30,priority:sprio,deadline,done:false,color:'#56606E',created:Date.now()};
        put('projects',sp);const inf=PLAN.info[sp.id];
        return {text:`Aggiunta la task "${title}" (${dur(sp.minutes)}), priorità ${PRIO[sprio].toLowerCase()}${deadline?', entro '+longDate(deadline):''}.${inf?` In calendario ${longDate(inf.start.date)} alle ${hm(inf.start.start)}.`:''}${d?'':' Durata standard 30 min.'} Per metterla in un progetto scrivi "… a nome progetto".`,undo:1};
      }
      const minutes=d||60;addTask(p.id,title,minutes);
      if(deadline){const nt=Object.values(S.tasks).filter(x=>x.projectId===p.id).sort((a,b)=>b.created-a.created)[0];if(nt)put('tasks',{...nt,deadline})}
      const nt=Object.values(S.tasks).filter(x=>x.projectId===p.id).sort((a,b)=>b.created-a.created)[0],inf=nt&&PLAN.info[nt.id];
      return {text:`Aggiunta "${title}" (${dur(minutes)}) a ${p.name}${d?'':', durata standard di 1h: cambiala se serve'}.${inf?` In calendario ${longDate(inf.start.date)} alle ${hm(inf.start.start)}.`:''}`,undo:1};
    }
  }
  return {text:'Non ho capito. Scrivi "aiuto" per vedere gli esempi.',err:1};
}

/* undo */
function snap(){return JSON.parse(JSON.stringify({clients:S.clients,projects:S.projects,tasks:S.tasks,blocks:S.blocks,settings:S.settings}))}
function restore(old){
  for(const c of ['clients','projects','tasks','blocks','jobs','quotes']){
    if(!old[c])continue;
    Object.keys(S[c]).forEach(id=>{if(!old[c][id])del(c,id)});
    Object.values(old[c]).forEach(o=>{if(JSON.stringify(S[c][o.id])!==JSON.stringify(o))put(c,o)});
  }
  if(JSON.stringify(S.settings)!==JSON.stringify(old.settings)){S.settings=old.settings;saveSettings()}
}
const chatLog=[];
const CHIPS={root:[['+ Aggiungi','sub:add'],['✓ Fatto','fatto '],['Sono libero','sono libero '],['Pausa','pausa 30 min'],['?','aiuto']],
  add:[['← ','sub:root'],['Task','task '],['Progetto','nuovo progetto '],['Attività','aggiungi  a '],['Evento','evento domani alle '],['Pausa pranzo','pausa pranzo dalle 13 alle 14']]};
let chipLevel='root';
function renderChips(){const el=$('#cchips');if(!el)return;
  el.innerHTML=CHIPS[chipLevel].map(([l,v])=>`<button type="button" class="cchip${v.startsWith('sub:')&&l!=='← '?' more':''}" data-chip="${esc(v)}">${esc(l)}</button>`).join('');}
const SUGG=['mercoledì 21 non ci sono','dentista giovedì dalle 15 alle 16','aggiungi video verticale 1h30 a spot prodotto','aiuto'];
function ctrlHtml(c){
  const p=S.projects[c.pid];if(!p)return '';
  const ts=c.ids.map(id=>S.tasks[id]).filter(Boolean);
  return `<div class="cc"><div class="cc-p"><span>Priorità</span><span class="seg3 mini">${[1,2,3].map(v=>`<button type="button" data-cprio="${p.id}" data-v="${v}" aria-pressed="${p.priority===v}">${PRIO[v]}</button>`).join('')}</span></div>
    ${ts.map(t=>`<label class="cc-t"><span>${esc(t.title)}</span><select data-cdur="${t.id}" aria-label="Durata di ${esc(t.title)}">${durOptions(t.minutes)}</select></label>`).join('')}</div>`;
}
function renderChat(){
  const el=$('#chatLog');
  if(!chatLog.length){
    el.innerHTML=`<div class="msg bot">Ciao Francesco, scrivimi cosa fare e lo metto in calendario.\nPuoi anche dettare: tocca il microfono della tastiera su iPhone, oppure premi Win + H su Windows.</div><div class="sugg">${SUGG.map(s=>`<button class="chip" data-sugg="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
  }else{
    el.innerHTML=chatLog.map((m,i)=>`<div class="msg ${m.who}${m.err?' err':''}">${esc(m.text)}${m.ctrl&&!m.undone?ctrlHtml(m.ctrl):''}${m.confirm&&!m.resolved?`<span class="confirm"><button class="btn primary" data-yes="${i}">${esc(m.confirm.yes)}</button><button class="btn" data-no="${i}">${esc(m.confirm.no)}</button></span>`:''}${m.undo&&!m.undone&&i===chatLog.length-1?`<button class="undo" data-undo="${i}">Annulla</button>`:''}${m.undone?'<span class="undo">Annullato</span>':''}</div>`).join('');
  }
  el.scrollTop=el.scrollHeight;
}
function resolveConfirm(i,yes){
  const m=chatLog[i];if(!m||!m.confirm||m.resolved)return;m.resolved=true;
  if(yes){const before=snap();chatLog.push({who:'bot',text:m.confirm.run(),undo:1,snap:before})}
  else chatLog.push({who:'bot',text:m.confirm.cancel});
  renderChat();
}
function send(text){
  text=text.trim();if(!text)return;
  const pi=chatLog.findIndex(m=>m.confirm&&!m.resolved);
  if(pi>=0){
    const a=N(text);
    if(/^(si|ok|certo|conferma|aggiungi|va bene|vai|procedi)\b/.test(a)){chatLog.push({who:'me',text});resolveConfirm(pi,true);return}
    if(/^(no|annulla|lascia|non)\b/.test(a)){chatLog.push({who:'me',text});resolveConfirm(pi,false);return}
    chatLog[pi].resolved=true;
  }
  chatLog.push({who:'me',text});
  const before=snap();let r;
  const parts=splitCommands(text);
  try{
    if(parts.length<=1)r=runCommand(text);
    else{const rs=parts.map(x=>{try{return runCommand(x)}catch(e){return {text:`Non sono riuscito a fare: "${x}".`,err:1}}}).filter(Boolean);
      r={text:rs.map(x=>(x.err?'⚠ ':'✓ ')+x.text).join('\n\n'),err:rs.every(x=>x.err),undo:rs.some(x=>x.undo),ctrl:(rs.find(x=>x.ctrl)||{}).ctrl}}
  }catch(e){r={text:'Qualcosa è andato storto con questo comando. Prova a riscriverlo in modo più semplice.',err:1}}
  if(r)chatLog.push({who:'bot',text:r.text,err:r.err,undo:r.undo,snap:r.undo?before:null,confirm:r.confirm,ctrl:r.ctrl});
  renderChat();
}
$('#chatLog').addEventListener('change',e=>{const sel=e.target.closest('[data-cdur]');if(!sel)return;const t=S.tasks[sel.dataset.cdur];if(t)put('tasks',{...t,minutes:+sel.value})});
$('#cchips').addEventListener('click',e=>{const b=e.target.closest('[data-chip]');if(!b)return;const v=b.dataset.chip;
  if(v.startsWith('sub:')){chipLevel=v.slice(4);renderChips();return}
  if(v==='aiuto'){send('aiuto');return}
  const i=$('#chatIn');i.value=v;i.focus();const pos=v.indexOf('  a ');const c=pos>=0?pos+1:v.length;i.setSelectionRange(c,c);chipLevel='root';renderChips()});
$('#chatForm').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatIn');send(i.value);i.value='';i.focus()});
$('#chatLog').addEventListener('click',e=>{
  const s=e.target.closest('[data-sugg]');if(s){$('#chatIn').value=s.dataset.sugg;$('#chatIn').focus();return}
  const cp=e.target.closest('[data-cprio]');if(cp){const p=S.projects[cp.dataset.cprio];if(p){setProjectPriority(p,+cp.dataset.v);renderChat()}return}
  const y=e.target.closest('[data-yes]');if(y){resolveConfirm(+y.dataset.yes,true);return}
  const no=e.target.closest('[data-no]');if(no){resolveConfirm(+no.dataset.no,false);return}

function timeByProject(year){
  const by={},add=(pid,m)=>{if(pid&&m>0)by[pid]=(by[pid]||0)+m};
  allTasks().forEach(t=>(t.log||[]).forEach(L=>{if(+L.d.slice(0,4)===year)add(t.solo?t.id:t.projectId,L.e-L.s)}));
  if(Object.values(S.blocks).some(b=>b.projectId)){
    const today=key(new Date()),nm=nowMin(),last=`${year}-12-31`<today?`${year}-12-31`:today;
    for(let k=`${year}-01-01`;k<=last;k=addDays(k,1))blocksOn(k).forEach(b=>{const base=S.blocks[b.id];if(!base||!base.projectId||isPause(b)||eventDone(b,k)==='no')return;
      const e=k===today?Math.min(b.end,nm):b.end;add(base.projectId,e-b.start)});
  }
  return by;
}

function barChart(data){ // data:[{l,a,b}] a=fatturato b=netto

  const bars=data.map((d,i)=>{const x=P+4+i*bw;return `<g><title>${d.l}: fatturato ${eur(d.a)} · netto ${eur(d.b)}</title><rect x="${x+bw*.12}" y="${y(d.a)}" width="${bw*.36}" height="${Math.max(0,H-24-y(d.a))}" rx="3" class="ba"/><rect x="${x+bw*.5}" y="${y(d.b)}" width="${bw*.36}" height="${Math.max(0,H-24-y(d.b))}" rx="3" class="bb"/><text x="${x+bw/2}" y="${H-6}" class="ax" text-anchor="middle">${d.l}</text></g>`}).join('');

function donut(parts){ // [{l,v,c}]

      :`<path d="M${pt(R,a0)} A${R} ${R} 0 ${lg} 1 ${pt(R,a1)} L${pt(r,a1)} A${r} ${r} 0 ${lg} 0 ${pt(r,a0)}Z" fill="${p.c}"><title>${esc(p.l)}: ${Math.round(p.v/tot*100)}%</title></path>`;a0=a1});

}
function finReport(y){
  const now=new Date(),js=jobsYear(y),t=sumJobs(js);
  const months=y<now.getFullYear()?12:y>now.getFullYear()?Math.max(1,new Set(js.map(j=>j.month)).size):now.getMonth()+1;
  const data=MESI3.map((l,i)=>{const s=sumJobs(jobsOf(y,i));return {l,a:s.amount+s.cash,b:s.net}});
  const time=timeByProject(y);
  // per cliente
  const byC={};js.forEach(j=>{const k=j.clientId||'_';const c=jobCalc(j);byC[k]=byC[k]||{amount:0,net:0,min:0};byC[k].amount+=c.amount+c.cash;byC[k].net+=c.net});
  Object.entries(time).forEach(([pid,m])=>{const p=S.projects[pid];if(!p||isSolo(p)||!p.clientId)return;byC[p.clientId]=byC[p.clientId]||{amount:0,net:0,min:0};byC[p.clientId].min+=m});
  const cl=Object.entries(byC).map(([id,v])=>({id,name:S.clients[id]?.name||'Senza cliente',color:S.clients[id]?.color||'#9AA0A6',...v})).sort((a,b)=>b.amount-a.amount||b.min-a.min);
  const totA=cl.reduce((a,c)=>a+c.amount,0)||1;
  // per progetto
  const byP={};js.forEach(j=>{if(!j.projectId)return;const c=jobCalc(j);byP[j.projectId]=byP[j.projectId]||{amount:0,net:0};byP[j.projectId].amount+=c.amount+c.cash;byP[j.projectId].net+=c.net});
  const pids=new Set([...Object.keys(byP),...Object.keys(time).filter(id=>S.projects[id]&&!isSolo(S.projects[id]))]);
  const pl=[...pids].map(id=>({id,p:S.projects[id],min:time[id]||0,...(byP[id]||{amount:0,net:0})})).filter(x=>x.p).sort((a,b)=>b.amount-a.amount||b.min-a.min);
  const rate=(net,min)=>min>=30&&net?eur(net/(min/60))+'/h':'<span class="fmut">—</span>';
  return `<div class="kpis big6">${kpi('Fatturato '+y,t.amount)}${kpi('Contanti',t.cash)}${kpi('Tasse stimate',t.tax,'neg')}${kpi('Netto',t.net,'big')}${kpi('Media entrate al mese',(t.amount+t.cash)/months)}${kpi('Media netto al mese',t.net/months,'big')}</div>
    <div class="fgrid">
      <div class="fcard"><h3>Mese per mese</h3>${barChart(data)}</div>
      <div class="fcard"><h3>Chi incide di più sul fatturato</h3>${cl.some(c=>c.amount)?`<div class="fdonut-wrap">${donut(cl.filter(c=>c.amount>0).map(c=>({l:c.name,v:c.amount,c:c.color})))}<ul class="flist">${cl.filter(c=>c.amount>0).map(c=>`<li><span class="dot" style="--c:${c.color}"></span>${esc(c.name)}<b>${Math.round(c.amount/totA*100)}%</b></li>`).join('')}</ul></div>`:'<p class="note">Ancora nessun lavoro nel '+y+'.</p>'}</div>
    </div>
    <div class="fcard"><h3>Clienti: guadagno e tempo</h3>${cl.length?`<div class="ft-wrap"><table class="ft rep"><thead><tr><th>Cliente</th><th class="r">Entrate</th><th class="r">Netto</th><th class="r">Incidenza</th><th class="r">Ore</th><th class="r">Netto all'ora</th></tr></thead><tbody>${cl.map(c=>`<tr><td data-l="Cliente"><span class="dot" style="--c:${c.color}"></span> ${esc(c.name)}</td><td data-l="Fatturato" class="r">${eur(c.amount)}</td><td data-l="Netto" class="r"><b>${eur(c.net)}</b></td><td data-l="Incidenza" class="r">${Math.round(c.amount/totA*100)}%</td><td data-l="Ore" class="r">${c.min?hrs(c.min):'—'}</td><td data-l="Netto all'ora" class="r">${rate(c.net,c.min)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">Nessun dato.</p>'}</div>
    <div class="fcard"><h3>Progetti: guadagno e tempo</h3>${pl.length?`<div class="ft-wrap"><table class="ft rep"><thead><tr><th>Progetto</th><th>Cliente</th><th class="r">Ore</th><th class="r">Fatturato</th><th class="r">Netto</th><th class="r">Netto all'ora</th></tr></thead><tbody>${pl.map(x=>`<tr><td data-l="Progetto"><span class="dot" style="--c:${x.p.color}"></span> ${esc(x.p.name)}</td><td data-l="Cliente">${esc(clientName(x.p)||'—')}</td><td data-l="Ore" class="r">${x.min?hrs(x.min):'—'}</td><td data-l="Fatturato" class="r">${x.amount?eur(x.amount):'—'}</td><td data-l="Netto" class="r"><b>${x.net?eur(x.net):'—'}</b></td><td data-l="Netto all'ora" class="r">${rate(x.net,x.min)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">Collega i lavori ai progetti per vedere quanto rende ogni ora.</p>'}
      <p class="note">Le ore vengono dal tempo registrato sulle attività del progetto e dagli eventi collegati al progetto.</p></div>`;
}
function finQuotes(y){
  const qs=Object.values(S.quotes).filter(q=>+q.year===y).sort((a,b)=>(b.num||0)-(a.num||0));
  const QS={bozza:['Bozza',''],inviato:['Inviato','#2F7DE1'],accettato:['Accettato','#22A55B'],rifiutato:['Rifiutato','#9AA0A6']};
  return `<div class="fcard"><div class="fm-h"><h2>Preventivi ${y}</h2><button type="button" class="btn primary" data-fa="newquote">+ Preventivo</button></div>
    ${qs.length?`<div class="qlist">${qs.map(q=>{const c=S.clients[q.clientId],st=QS[q.status]||QS.bozza;return `<button type="button" class="qrow" data-fq="${q.id}" style="${st[1]?`--rc:${st[1]}`:''}"><span class="qnum">${esc(qCode(q))}</span><span class="qmain"><b>${esc(q.title||'Senza titolo')}</b><small>${esc(c?.name||'Nessun cliente')} · ${fmtD(q.date,'it')}</small></span><span class="qtot">${eur(qTotals(q).tot)}</span><span class="qst">${st[0]}</span></button>`}).join('')}</div>`
      :`<div class="empty"><strong>Nessun preventivo nel ${y}</strong><span>Crea un preventivo: logo, dati, voci e firma sono già pronti. Poi lo esporti in PDF.</span><button type="button" class="btn primary" data-fa="newquote">+ Preventivo</button></div>`}
  </div>`;
}

/* ---------- fatture ---------- */
const invRiv=j=>j.invRivalsa?(+j.amount||0)*0.04:0;
const invTot=j=>(+j.amount||0)+invRiv(j)+(j.invBollo?2:0);
function nextInvoiceNo(y){let n=0;Object.values(S.jobs).forEach(j=>{const m=String(j.invoiceNo||'').match(/^(\d+)\s*\/\s*(\d{4})$/);if(m&&+m[2]===y)n=Math.max(n,+m[1])});return `${n+1}/${y}`}
function invGroups(y){
  const all=Object.values(S.jobs).filter(j=>(+j.amount||0)>0);
  const toIssue=all.filter(j=>!j.invoiceNo&&j.status!=='pagato'&&j.status!=='prev');
  const toCollect=all.filter(j=>j.invoiceNo&&j.status!=='pagato');
  const paid=all.filter(j=>j.status==='pagato'&&+String(j.paidAt||j.invoiceDate||j.month).slice(0,4)===y);
  const by=(a,b)=>String(a.invoiceDate||a.month).localeCompare(String(b.invoiceDate||b.month));
  return {toIssue:toIssue.sort(by),toCollect:toCollect.sort(by),paid:paid.sort(by).reverse()};
}
function finInvoices(y){
  const g=invGroups(y),today=key(new Date()),sum=l=>l.reduce((a,j)=>a+invTot(j),0);
  const row=(j,kind)=>{const c=S.clients[j.clientId],late=kind==='collect'&&j.invoiceDue&&j.invoiceDue<today,miss=kind==='issue'&&c?billMissing(c):[];
    const sub=kind==='issue'?`${MESI[+j.month.slice(5)-1]} ${j.month.slice(0,4)}${miss.length?' · <span class="fwarn">dati fattura</span>':''}`
      :kind==='collect'?`N° ${esc(j.invoiceNo)} · emessa ${j.invoiceDate?fmtD(j.invoiceDate,'it'):'—'}${j.invoiceDue?` · scade ${fmtD(j.invoiceDue,'it')}`:''}${j.invoiceSent?'':' · <b>non ancora inviata</b>'}`
      :`N° ${esc(j.invoiceNo||'—')} · incassata ${j.paidAt?fmtD(j.paidAt,'it'):''}`;
    return `<button type="button" class="qrow inv${late?' late':''}" data-fi="${j.id}" style="--rc:${kind==='paid'?'#22A55B':late?'#E5484D':kind==='collect'?'#EF7D1A':'#2F7DE1'}"><span class="qmain"><b>${esc(c?.name||'Senza cliente')} · ${esc(j.title||S.projects[j.projectId]?.name||'Lavoro')}</b><small>${sub}${late?' · <b style="color:#E5484D">scaduta</b>':''}</small></span><span class="qtot">${eur(invTot(j))}</span><span class="qst">${kind==='issue'?'Emetti':kind==='collect'?'Incassata?':'✓'}</span></button>`};
  const sec=(t,l,kind,empty)=>`<div class="fcard"><div class="fm-h"><h3>${t}</h3><b>${eur(sum(l))}</b></div>${l.length?`<div class="qlist">${l.map(j=>row(j,kind)).join('')}</div>`:`<p class="note">${empty}</p>`}</div>`;
  return `<div class="kpis big6 k3">${kpi('Da fatturare',sum(g.toIssue))}${kpi('Ti devono',sum(g.toCollect),'neg')}${kpi('Incassato nel '+y,sum(g.paid),'big')}</div>
    ${sec('Da fatturare',g.toIssue,'issue','Nessun lavoro in attesa di fattura. Un lavoro compare qui quando è «In corso» o «Da fatturare» e ha un importo.')}
    ${sec('Da incassare',g.toCollect,'collect','Nessuna fattura in attesa di pagamento.')}
    ${sec('Incassate nel '+y,g.paid,'paid','Ancora nessuna fattura incassata nel '+y+'.')}`;
}

    <div class="row3"><div class="field"><label for="iN">Numero</label><input id="iN" value="${esc(no)}"></div><div class="field"><label for="iD">Data</label><input id="iD" type="date" value="${d}"></div><div class="field"><label for="iS">Scadenza</label><input id="iS" type="date" value="${j.invoiceDue||addDays(d,30)}"></div></div>

  const upd=()=>{const a=num($('#iA').value),r=$('#iR').checked?a*0.04:0,b=$('#iB').checked?2:0,t=taxCalc(a+r,+($('#iD').value||today).slice(0,4));
    $('#iCalc').innerHTML=`<span>Totale fattura <b>${eur(a+r+b)}</b>${r?` <small>(rivalsa ${eur(r)})</small>`:''}</span><span>Netto stimato <b>${eur(t.net)}</b></span>`;$('#iPdW').hidden=!$('#iPaid').checked};
  ['#iA','#iR','#iB','#iPaid','#iD'].forEach(s=>$(s).addEventListener('input',upd));upd();
  $('#iD').addEventListener('change',()=>{$('#iS').value=addDays($('#iD').value||today,30)});
  $('#cancel').onclick=()=>dlg.close();
  const fx=$('#iFix');if(fx)fx.onclick=()=>openClient(c);
  const dl=$('#iDel');if(dl)dl.onclick=()=>{if(!dl.classList.contains('armed')){dl.classList.add('armed');dl.textContent='Conferma';return}put('jobs',{...j,invoiceNo:'',invoiceDate:null,invoiceDue:null,invoiceSent:false,status:j.status==='pagato'||j.status==='attesa'?'fatt':j.status});dlg.close()};
  form.onsubmit=e=>{e.preventDefault();const paid=$('#iPaid').checked;
    put('jobs',{...j,invoiceNo:$('#iN').value.trim(),invoiceDate:$('#iD').value||today,invoiceDue:$('#iS').value||null,amount:num($('#iA').value),invRivalsa:$('#iR').checked,invBollo:$('#iB').checked,invoiceSent:$('#iSent').checked,
      status:paid?'pagato':'attesa',paidAt:paid?($('#iPd').value||today):null});

}

  j=j||{id:uid(),month:`${y}-${String(m+1).padStart(2,'0')}`,day:'',clientId:null,projectId:null,title:'',amount:0,cash:0,status:'prev',created:Date.now()};

  form.innerHTML=`<h3>${isNew?'Nuovo lavoro':'Lavoro'}</h3>
    <div class="row"><div class="field"><label for="jM">Mese</label><input id="jM" type="month" value="${j.month}"></div><div class="field"><label for="jD">Giorno/i</label><input id="jD" value="${esc(j.day||'')}" placeholder="es. 16 oppure 27/31"></div></div>

    <div class="field"><label for="jP">Progetto (facoltativo)</label><select id="jP"><option value="">Nessun progetto</option>${projs.map(p=>`<option value="${p.id}" ${p.id===j.projectId?'selected':''}>${esc(p.name)}${clientName(p)?' · '+esc(clientName(p)):''}${p.archived?' (archiviato)':''}</option>`).join('')}</select></div>
    <div class="field"><label for="jT">Descrizione</label><input id="jT" value="${esc(j.title||'')}" placeholder="es. Video recap evento"></div>
    <div class="field"><label for="jQ">Preventivo</label><select id="jQ"><option value="">Nessuno</option>${qs.map(q=>`<option value="${q.id}" ${q.id===j.quoteId?'selected':''}>${esc(qCode(q))} · ${esc(q.title||'')}</option>`).join('')}<option value="__url" ${!j.quoteId&&j.quoteUrl?'selected':''}>Link esterno…</option></select><input id="jQu" type="url" value="${esc(j.quoteUrl||'')}" placeholder="Incolla il link al preventivo (Google Drive, Sheets…)" hidden></div>
    <div class="row"><div class="field"><label for="jA">Fatturato €</label><input id="jA" inputmode="decimal" value="${j.amount?String(j.amount).replace('.',','):''}" placeholder="0,00"></div><div class="field"><label for="jK">Contanti / non fatturato €</label><input id="jK" inputmode="decimal" value="${j.cash?String(j.cash).replace('.',','):''}" placeholder="0,00"></div></div>
    <div class="jcalc" id="jCalc"></div>
    <div class="field"><label for="jS">Stato</label><select id="jS">${JST.map(([v,l])=>`<option value="${v}" ${v===(j.status||'prev')?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="row"><div class="field"><label for="jN">Fattura n°</label><input id="jN" value="${esc(j.invoiceNo||'')}" placeholder="es. 31/2026"></div><div class="field"><label for="jID">Data fattura</label><input id="jID" type="date" value="${j.invoiceDate||''}"></div></div>
    <label class="chk"><input type="checkbox" id="jIS" ${j.invoiceSent?'checked':''}> Fattura inviata</label>
    <label class="chk"><input type="checkbox" id="jIR" ${j.invRivalsa?'checked':''}> Rivalsa INPS 4% in fattura</label>
    <div class="field"><label for="jNo">Note</label><textarea id="jNo" rows="2">${esc(j.notes||'')}</textarea></div>
    <p class="note warn" id="jWarn" hidden></p>
    <div class="acts">${isNew?'':`<button type="button" class="btn danger left" id="jDel">Elimina</button>`}<button type="button" class="btn ghost" id="cancel">Annulla</button><button type="submit" class="btn primary">${isNew?'Aggiungi':'Salva'}</button></div>`;
  const C=$('#jC'),Cn=$('#jCn'),P=$('#jP'),Q=$('#jQ'),Qu=$('#jQu');
  const upd=()=>{const a0=num($('#jA').value),a=a0+($('#jIR').checked?a0*0.04:0),k=num($('#jK').value),yy=+($('#jM').value||'').slice(0,4)||y,t=taxCalc(a,yy);
    $('#jCalc').innerHTML=a||k?`<span>Tasse stimate <b>${eur(t.tot)}</b> <small>(INPS ${eur(t.inps)} + imposta ${eur(t.irpef)})</small></span><span>Netto <b>${eur(t.net+k)}</b></span>`:'';
    const c=S.clients[C.value],miss=c&&a>0?billMissing(c):[],w=$('#jWarn');
    w.hidden=!miss.length;if(miss.length){w.innerHTML=`Per fatturare a ${esc(c.name)} mancano: ${esc(miss.join(', '))}. <button type="button" class="linkbtn" id="jFix">Completa i dati del cliente</button>`;$('#jFix').onclick=()=>openClient(c)}};

  P.onchange=()=>{const p=S.projects[P.value];if(p){if(p.clientId&&S.clients[p.clientId]){C.value=p.clientId;Cn.hidden=true}if(!$('#jT').value.trim())$('#jT').value=p.name}upd()};

    const [yy,mm]=mo.split('-').map(Number);if(yy&&mm){FIN.year=yy;FIN.month=mm-1}
    dlg.close();renderFin();
  };
  show(true);
}

      <div class="qe-act"><button type="button" class="btn ghost qe-prevbtn" data-qa="preview">Anteprima</button><button type="button" class="btn" data-qa="job">${Object.values(S.jobs).some(j=>j.quoteId===q.id)?'Lavoro collegato ✓':'Aggiungi ai lavori'}</button><button type="button" class="btn primary" data-qa="pdf">Esporta PDF</button></div></div>
    <div class="qe-grid">
      <div class="qe-form">
        <div class="row3"><div class="field"><label>Numero</label><input id="qN" inputmode="numeric" value="${q.num}"></div><div class="field"><label>Data</label><input id="qD" type="date" value="${q.date}"></div><div class="field"><label>Valido fino al</label><input id="qV" type="date" value="${q.valid}"></div></div>
        <div class="row"><div class="field"><label>Cliente</label><select id="qC"><option value="">Scegli…</option>${cs.map(c=>`<option value="${c.id}" ${c.id===q.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}<option value="__new">+ Nuovo cliente…</option></select><input id="qCn" placeholder="Nome del nuovo cliente" hidden></div>
          <div class="field"><label>Lingua</label><select id="qL"><option value="it" ${q.lang==='it'?'selected':''}>Italiano</option><option value="en" ${q.lang==='en'?'selected':''}>English</option></select></div></div>
        <p class="note warn" id="qWarn" hidden></p>
        <div class="field"><label>Titolo del progetto</label><input id="qT" value="${esc(q.title)}" placeholder="es. Produzione contenuti foto e video – EADV Vienna"></div>
        <div class="field"><label>Descrizione</label><textarea id="qDe" rows="4" placeholder="Cosa comprende il servizio…">${esc(q.desc)}</textarea></div>
        <span class="lbl">Voci</span>
        <div id="qItems">${(q.items||[]).map(itemRow).join('')}</div>
        <button type="button" class="btn" data-qa="additem">+ Voce</button>
        <datalist id="qiList">${Object.keys(past).map(t=>`<option value="${esc(t)}"></option>`).join('')}</datalist>
        <div class="row"><div class="field"><label>Sconto €</label><input id="qS" inputmode="decimal" value="${q.discount?String(q.discount).replace('.',','):''}" placeholder="0"></div><div class="field"><label>Stato</label><select id="qSt">${QS.map(([v,l])=>`<option value="${v}" ${v===q.status?'selected':''}>${l}</option>`).join('')}</select></div></div>
        <label class="chk"><input type="checkbox" id="qR" ${q.rivalsa?'checked':''}> Aggiungi rivalsa INPS 4%</label>
        <label class="chk"><input type="checkbox" id="qB" ${q.bollo?'checked':''}> Aggiungi marca da bollo (2 €)</label>
        <div class="qe-tot" id="qTot"></div>
        <div class="field"><label>Condizioni generali</label><textarea id="qTe" rows="3">${esc(q.terms||'')}</textarea></div>
        <div class="field"><label>Note e istruzioni</label><textarea id="qNo" rows="4">${esc(q.notes||'')}</textarea></div>
        <div class="acts"><button type="button" class="btn danger left" id="qDel">Elimina preventivo</button><button type="button" class="btn" data-qa="dup">Duplica</button></div>
        ${!b.sign||!S.biz.profile?`<p class="note">Logo, firma e i tuoi dati si impostano in <button type="button" class="linkbtn" data-qa="biz">Dati attività</button>.</p>`:''}
      </div>
      <div class="qe-prev" id="qPrev"><div class="qe-paper" id="qPaper">${quoteDoc(q)}</div></div>
    </div></div>`;
  let cur=JSON.parse(JSON.stringify(q)),saveT=null;
  const paper=$('#qPaper'),prev=$('#qPrev'),saved=$('#qeSaved');
  const fit=()=>{const w=prev.clientWidth-24;const s=Math.min(1,w/794);paper.style.setProperty('--qs',s);paper.style.height=(paper.firstElementChild.offsetHeight*s)+'px'};
  const refresh=()=>{paper.innerHTML=quoteDoc(cur);fit();const t=qTotals(cur);$('#qTot').innerHTML=`<span>Subtotale <b>${eur(t.sub)}</b></span>${t.disc?`<span>Sconto <b>−${eur(t.disc)}</b></span>`:''}<span>Totale <b>${eur(t.tot)}</b></span>`;
    const c=S.clients[cur.clientId],miss=c?billMissing(c):[],w=$('#qWarn');w.hidden=!miss.length;if(miss.length){w.innerHTML=`Nel preventivo mancano i dati di ${esc(c.name)}: ${esc(miss.join(', '))}. <button type="button" class="linkbtn" id="qFix">Completa</button>`;$('#qFix').onclick=()=>openClient(c)}
    el.querySelector('.qe-code').textContent=qCode(cur)};
  const save=()=>{saved.textContent='Salvo…';clearTimeout(saveT);saveT=setTimeout(()=>{put('quotes',cur);saved.textContent='Salvato'},500)};
  const read=()=>{cur.num=parseInt($('#qN').value)||cur.num;cur.date=$('#qD').value||cur.date;cur.year=+cur.date.slice(0,4);cur.valid=$('#qV').value;cur.title=$('#qT').value;cur.desc=$('#qDe').value;
    cur.discount=num($('#qS').value);cur.status=$('#qSt').value;cur.rivalsa=$('#qR').checked;cur.bollo=$('#qB').checked;cur.terms=$('#qTe').value;cur.notes=$('#qNo').value;
    const L=$('#qL').value;if(L!==cur.lang){const bb=biz();if(cur.terms===(cur.lang==='en'?bb.termsEn:bb.termsIt)){cur.terms=L==='en'?bb.termsEn:bb.termsIt;$('#qTe').value=cur.terms}if(cur.notes===(cur.lang==='en'?bb.notesEn:bb.notesIt)){cur.notes=L==='en'?bb.notesEn:bb.notesIt;$('#qNo').value=cur.notes}cur.lang=L}
    cur.items=[...el.querySelectorAll('.qi')].map((r,i)=>({id:cur.items[i]?.id||uid(),title:r.querySelector('.qi-t').value,desc:r.querySelector('.qi-d').value,price:r.querySelector('.qi-p').value.trim()===''?'':num(r.querySelector('.qi-p').value),qty:num(r.querySelector('.qi-q').value)||0}));
    el.querySelectorAll('.qi').forEach((r,i)=>{const it=cur.items[i];r.querySelector('.qi-lt').textContent=num(it.price)?eur(num(it.price)*num(it.qty)):'Incluso'})};
  const redrawItems=()=>{$('#qItems').innerHTML=cur.items.map(itemRow).join('');refresh();save()};
  el.querySelector('.qe-form').addEventListener('input',e=>{if(e.target.id==='qCn')return;read();refresh();save()});
  el.querySelector('.qe-form').addEventListener('change',e=>{
    if(e.target.id==='qC'){const v=e.target.value;$('#qCn').hidden=v!=='__new';if(v==='__new'){$('#qCn').focus();return}cur.clientId=v||null;refresh();save();return}
    if(e.target.id==='qCn'){const n=e.target.value.trim();if(!n)return;const c=findOrCreateClient(n);cur.clientId=c.id;const s=$('#qC');s.insertAdjacentHTML('afterbegin',`<option value="${c.id}">${esc(c.name)}</option>`);s.value=c.id;e.target.hidden=true;refresh();save();return}
    if(e.target.classList.contains('qi-t')){const p=past[e.target.value],r=e.target.closest('.qi');if(p&&!r.querySelector('.qi-d').value&&!r.querySelector('.qi-p').value){r.querySelector('.qi-d').value=p.desc||'';r.querySelector('.qi-p').value=String(p.price??'').replace('.',',');read();refresh();save()}}
  });
  el.querySelector('.qe-form').addEventListener('click',e=>{const r=e.target.closest('.qi');
    if(e.target.matches('[data-qx]')){read();cur.items.splice(+r.dataset.i,1);redrawItems()}
    else if(e.target.matches('[data-qm]')){read();const i=+r.dataset.i,j=i+ +e.target.dataset.qm;if(j<0||j>=cur.items.length)return;[cur.items[i],cur.items[j]]=[cur.items[j],cur.items[i]];redrawItems()}});
  el.onclick=e=>{const a=e.target.closest('[data-qa]')?.dataset.qa;if(!a)return;
    if(a==='back'){read();clearTimeout(saveT);put('quotes',cur);FIN.q=null;renderFin(true)}
    else if(a==='additem'){read();cur.items.push({id:uid(),title:'',desc:'',price:'',qty:1});redrawItems();const l=el.querySelectorAll('.qi-t');l[l.length-1].focus()}
    else if(a==='pdf'){read();clearTimeout(saveT);put('quotes',cur);printQuote(cur)}
    else if(a==='preview'){prev.classList.toggle('show');fit()}
    else if(a==='biz')openBiz();
    else if(a==='dup'){read();put('quotes',cur);const n={...JSON.parse(JSON.stringify(cur)),id:uid(),num:nextQuoteNum(),date:key(new Date()),status:'bozza',created:Date.now()};n.year=+n.date.slice(0,4);n.valid=addDays(n.date,+biz().qValid||90);put('quotes',n);FIN.q=n.id;renderFin(true);toast('Preventivo duplicato')}
    else if(a==='job'){read();put('quotes',cur);const ex=Object.values(S.jobs).find(j=>j.quoteId===cur.id);if(ex){FIN.q=null;FIN.view='mesi';const [yy,mm]=ex.month.split('-').map(Number);FIN.year=yy;FIN.month=mm-1;renderFin(true);openJob(ex);return}
      const t=qTotals(cur),mo=cur.date.slice(0,7);put('jobs',{id:uid(),month:mo,day:'',clientId:cur.clientId,projectId:null,title:cur.title,quoteId:cur.id,amount:t.imp,cash:0,status:cur.status==='accettato'?'corso':'prev',created:Date.now()});
      e.target.textContent='Lavoro collegato ✓';toast(`Aggiunto ai lavori di ${MESI[+mo.slice(5)-1].toLowerCase()}`)}};
  const del0=$('#qDel');del0.onclick=()=>{if(!del0.classList.contains('armed')){del0.classList.add('armed');del0.textContent='Conferma eliminazione';return}clearTimeout(saveT);del('quotes',cur.id);FIN.q=null;renderFin(true)};
  requestAnimationFrame(()=>{fit();refresh()});
  if(!window.__qfit){window.__qfit=1;addEventListener('resize',()=>{const p=$('#qPaper'),pv=$('#qPrev');if(p&&pv&&p.firstElementChild){const s=Math.min(1,(pv.clientWidth-24)/794);p.style.setProperty('--qs',s);p.style.height=(p.firstElementChild.offsetHeight*s)+'px'}})}
}

/* ---------- dati attività: profilo, fisco, logo, firma, preventivi ---------- */
function readImage(file,maxW,maxH){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,maxW/img.width,maxH/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/png'))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function openBiz(){
  const b=biz(),f=fisc(),fld=(id,l,v,ph,type)=>`<div class="field"><label for="${id}">${l}</label><input id="${id}" ${type?`type="${type}"`:''} value="${esc(v??'')}" placeholder="${esc(ph||'')}"></div>`;
  form.innerHTML=`<h3>Dati attività</h3>
    <span class="lbl">La tua attività</span>
    <div class="row">${fld('bName','Ragione sociale',b.name)}${fld('bBrand','Marchio (se non hai il logo)',b.brand)}</div>
    <div class="row">${fld('bOwner','Titolare',b.owner)}${fld('bRole','Ruolo (sotto la firma)',b.role)}</div>
    <div class="row">${fld('bVat','Partita IVA',b.vat)}${fld('bCity','Città',b.city)}</div>
    ${fld('bAddr','Indirizzo (facoltativo)',b.address)}
    <div class="row">${fld('bPhone','Telefono',b.phone)}${fld('bEmail','Email',b.email,'','email')}</div>
    <div class="row">${fld('bWeb','Sito',b.web)}${fld('bTag','Frase in fondo al preventivo',b.tagline)}</div>
    <div class="cedit"><span class="lbl">Logo</span><div class="bimg" id="bLogoBox">${b.logo?`<img src="${b.logo}" alt="Logo">`:'<span class="note">Nessun logo: uso il marchio scritto.</span>'}</div>
      <div class="padd"><button type="button" class="btn" id="bLogoUp">Carica logo</button>${b.logo?`<button type="button" class="btn ghost" id="bLogoDel">Rimuovi</button>`:''}<input type="file" id="bLogoF" accept="image/*" hidden></div></div>
    <div class="cedit"><span class="lbl">Firma</span><p class="note" style="margin:0">Firma qui sotto col dito o col mouse, oppure carica un'immagine della firma.</p>
      <canvas id="bSign" class="bsign" width="600" height="200"></canvas>
      <div class="padd"><button type="button" class="btn ghost" id="bSignClr">Cancella</button><button type="button" class="btn" id="bSignUp">Carica immagine</button><input type="file" id="bSignF" accept="image/*" hidden></div></div>
    <div class="cedit"><span class="lbl">Fisco · regime forfettario</span>
      <div class="row">${fld('fAteco','Codice ATECO',f.ateco)}${fld('fStart','Inizio attività',f.start,'','date')}</div>
      <div class="row">${fld('fCoeff','Coefficiente di redditività %',f.coeff)}${fld('fInps','Contributi INPS (gestione separata) %',f.inps)}</div>
      <div class="row"><div class="field"><label for="fTaxM">Imposta sostitutiva</label><select id="fTaxM"><option value="auto" ${f.taxMode==='auto'?'selected':''}>Automatica (5% i primi 5 anni, poi 15%)</option><option value="man" ${f.taxMode!=='auto'?'selected':''}>Scelgo io</option></select></div>${fld('fTax','Aliquota %',f.taxMode==='auto'?taxRate(new Date().getFullYear()):f.tax)}</div>
      <p class="note">Calcolo: fatturato × coefficiente = imponibile; su questo l'INPS; sull'imponibile meno l'INPS l'imposta sostitutiva. Con questi dati 1.000 € → ${eur(taxCalc(1000,new Date().getFullYear()).tot)} di tasse. È una stima: per gli importi esatti fa fede il commercialista.</p></div>
    <div class="cedit"><span class="lbl">Preventivi</span>
      <div class="row">${fld('qNext','Prossimo numero',nextQuoteNum())}${fld('qFmt','Formato del codice',b.qFmt,'P-{n}_{yyyy}')}</div>
      <div class="row"><div class="field"><label for="qLang">Lingua predefinita</label><select id="qLang"><option value="it" ${b.qLang==='it'?'selected':''}>Italiano</option><option value="en" ${b.qLang==='en'?'selected':''}>English</option></select></div>${fld('qValid','Validità (giorni)',b.qValid)}</div>
      <div class="field"><span class="lbl">Colore del documento</span>${swatches(b.qColor)}</div>
      <label class="chk"><input type="checkbox" id="qRiv" ${b.rivalsa?'checked':''}> Rivalsa INPS 4% già spuntata nei nuovi preventivi</label>
      <label class="chk"><input type="checkbox" id="qBol" ${b.bollo?'checked':''}> Marca da bollo già spuntata nei nuovi preventivi</label>
      <div class="field"><label for="qNIt">Note standard (italiano)</label><textarea id="qNIt" rows="3">${esc(b.notesIt)}</textarea></div>
      <div class="field"><label for="qNEn">Note standard (inglese)</label><textarea id="qNEn" rows="3">${esc(b.notesEn)}</textarea></div>
      <div class="field"><label for="qTIt">Condizioni generali (italiano)</label><textarea id="qTIt" rows="2">${esc(b.termsIt)}</textarea></div>
      <div class="field"><label for="qTEn">Condizioni generali (inglese)</label><textarea id="qTEn" rows="2">${esc(b.termsEn)}</textarea></div></div>
    <div class="acts"><button type="button" class="btn ghost" id="cancel">Annulla</button><button type="submit" class="btn primary">Salva</button></div>`;
  form.querySelector('.swatches').insertAdjacentHTML('beforeend',['#0B3D6B','#1C1C1E'].filter(c=>!PALETTE.includes(c)).map(c=>`<button type="button" class="sw" style="--c:${c}" data-c="${c}" aria-label="Colore" aria-pressed="${c===b.qColor}"></button>`).join(''));
  const getC=wireSwatches();
  let logo=b.logo,sign=b.sign,signDirty=false;
  const cv=$('#bSign'),cx=cv.getContext('2d');cx.lineWidth=3.2;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#111';
  const drawImg=src=>{cx.clearRect(0,0,cv.width,cv.height);if(!src)return;const im=new Image();im.onload=()=>{const s=Math.min(cv.width/im.width,cv.height/im.height);cx.drawImage(im,(cv.width-im.width*s)/2,(cv.height-im.height*s)/2,im.width*s,im.height*s)};im.src=src};
  drawImg(sign);
  let drawing=false,last=null;const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);last=pos(e);signDirty=true;e.preventDefault()};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);cx.beginPath();cx.moveTo(...last);cx.lineTo(...p);cx.stroke();last=p};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
  $('#bSignClr').onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);sign=null;signDirty=true};
  $('#bSignUp').onclick=()=>$('#bSignF').click();
  $('#bSignF').onchange=async e=>{const f0=e.target.files[0];if(!f0)return;sign=await readImage(f0,600,200);signDirty=false;drawImg(sign)};
  $('#bLogoUp').onclick=()=>$('#bLogoF').click();
  $('#bLogoF').onchange=async e=>{const f0=e.target.files[0];if(!f0)return;logo=await readImage(f0,800,320);$('#bLogoBox').innerHTML=`<img src="${logo}" alt="Logo">`};
  const ld=$('#bLogoDel');if(ld)ld.onclick=()=>{logo=null;$('#bLogoBox').innerHTML='<span class="note">Nessun logo: uso il marchio scritto.</span>';ld.remove()};
  $('#fTaxM').onchange=()=>{if($('#fTaxM').value==='auto')$('#fTax').value=taxRate(new Date().getFullYear())};
  $('#cancel').onclick=()=>dlg.close();
  form.onsubmit=e=>{e.preventDefault();
    if(signDirty){const blank=!cx.getImageData(0,0,cv.width,cv.height).data.some((v,i)=>i%4===3&&v>0);sign=blank?null:cv.toDataURL('image/png')}
    const v=id=>$('#'+id).value.trim();
    put('biz',{...(S.biz.profile||{}),id:'profile',name:v('bName'),brand:v('bBrand'),owner:v('bOwner'),role:v('bRole'),vat:v('bVat'),city:v('bCity'),address:v('bAddr'),phone:v('bPhone'),email:v('bEmail'),web:v('bWeb'),tagline:v('bTag'),logo,sign,
      qNext:parseInt(v('qNext'))||1,qFmt:v('qFmt')||'P-{n}_{yyyy}',qLang:$('#qLang').value,qValid:parseInt(v('qValid'))||90,qColor:getC(),rivalsa:$('#qRiv').checked,bollo:$('#qBol').checked,
      notesIt:$('#qNIt').value,notesEn:$('#qNEn').value,termsIt:$('#qTIt').value,termsEn:$('#qTEn').value,
      fiscal:{regime:'forfettario',ateco:v('fAteco'),start:v('fStart'),coeff:num(v('fCoeff')),inps:num(v('fInps')),taxMode:$('#fTaxM').value==='auto'?'auto':'man',tax:num(v('fTax'))}});
    dlg.close();renderFin(true);toast('Dati attività salvati');
  };
  show(true);
}

/* ---------- eventi della vista Conti ---------- */
$('#fin').addEventListener('click',e=>{
  const t=e.target;
  const fv=t.closest('[data-fv]');if(fv){FIN.view=fv.dataset.fv;renderFin();return}
  const fy=t.closest('[data-fy]');if(fy){FIN.year+= +fy.dataset.fy;renderFin();return}
  const fm=t.closest('[data-fm]');if(fm){FIN.month=+fm.dataset.fm;renderFin();return}
  const fi=t.closest('[data-fi]');if(fi&&S.jobs[fi.dataset.fi]){openInvoice(S.jobs[fi.dataset.fi]);return}
  const fq=t.closest('[data-fq]');if(fq){FIN.view='prev';FIN.q=fq.dataset.fq;renderFin(true);return}
  const fa=t.closest('[data-fa]');if(fa){const a=fa.dataset.fa;if(a==='newjob')openJob();else if(a==='newquote')newQuote();else if(a==='biz')openBiz();return}
  if(t.closest('select,a,input'))return;
  const fr=t.closest('[data-fj]');if(fr&&S.jobs[fr.dataset.fj])openJob(S.jobs[fr.dataset.fj]);
});
$('#fin').addEventListener('change',e=>{const s=e.target.closest('[data-fs]');if(!s)return;const j=S.jobs[s.dataset.fs];if(j)put('jobs',{...j,status:s.value,...(s.value==='pagato'&&!j.paidAt?{paidAt:key(new Date())}:{})})});
$('#listFin').onclick=()=>finOpen()?closeFin():openFin();
$('#tabFin').onclick=()=>openFin();

init();
})();
</script>
